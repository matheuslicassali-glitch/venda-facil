<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Venda Fácil</title>
  <link rel="icon" type="image/x-icon" href="/icon.ico">
  <style>
    :root {
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #splash-static {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      background: #f8fafc;
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: splash-in 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .splash-logo {
      position: relative;
      margin-bottom: 64px;
      filter: drop-shadow(0 10px 30px rgba(37, 99, 235, 0.15));
    }
    .splash-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 0, 0, 0.05);
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .splash-text {
      margin-top: 24px;
      font-size: 11px;
      font-weight: 900;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <!-- Splash estático: aparece IMEDIATAMENTE antes do JS carregar -->
  <div id="splash-static">
    <div class="splash-container">
      <div class="splash-logo">
        <svg width="120" height="120" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Cart Main Body (Dark Blue for Light Theme) -->
          <path d="M80 120H130L180 340H400L450 180H165" stroke="#0f172a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Wheels -->
          <circle cx="210" cy="410" r="30" fill="#0f172a" />
          <circle cx="370" cy="410" r="30" fill="#0f172a" />
          <!-- Lightning Bolt -->
          <path d="M300 60L210 240H280L240 440L360 200H280L330 60H300Z" fill="#3b82f6" stroke="white" stroke-width="8" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="splash-spinner"></div>
      <p class="splash-text">Sincronizando Sistema</p>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
