<!DOCTYPE html>
<html>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const svgData = `<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M80 120H130L180 340H400L450 180H165" stroke="#0f172a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="210" cy="410" r="30" fill="#0f172a" />
            <circle cx="370" cy="410" r="30" fill="#0f172a" />
            <path d="M300 60L210 240H280L240 440L360 200H280L330 60H300Z" fill="#3b82f6" stroke="white" stroke-width="8" stroke-linejoin="round" />
        </svg>`;

        const img = new Image();
        const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.fillStyle = 'white'; // Icon background
            ctx.fillRect(0, 0, 512, 512);
            ctx.drawImage(img, 0, 0);
            const pngData = canvas.toDataURL('image/png');
            console.log('PNG_DATA_START' + pngData + 'PNG_DATA_END');
            document.body.innerHTML = 'DONE';
        };
        img.src = url;
    </script>
</body>
</html>
